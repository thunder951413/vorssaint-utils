name: Fork Release

# Builds and publishes this fork's own releases. The upstream release workflow
# only runs in vorssaint/vorssaint-utils with its Developer ID; here the app is
# signed with the certificate in the SIGNING_CERT_P12 / SIGNING_CERT_PASSWORD
# secrets, the same one used for local installs, so permissions and the fan
# helper survive updates and the in-app updater accepts the result.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag on main to release (leave blank to release HEAD of main using Info.plist version)"
        required: false

permissions: {}

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign & publish
    if: github.repository == 'thunder951413/vorssaint-utils'
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || (startsWith(github.ref, 'refs/tags/') && github.ref || 'refs/heads/main') }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release is on main & matches app version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${COMMIT}" --jq .status)"
          if [[ "$STATUS" != "identical" && "$STATUS" != "behind" ]]; then
            echo "Release commit ${COMMIT:0:8} is not on the main branch (status: $STATUS)" >&2
            exit 1
          fi
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          else
            TAG="v${APP_VERSION}"
          fi
          VERSION="${TAG#v}"
          if [[ "$APP_VERSION" != "$VERSION" ]]; then
            echo "Tag $TAG does not match app version $APP_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./build.sh --test

      - name: Set up signing
        env:
          REQUIRE_SIGNING: "1"
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./Tools/ci-setup-signing.sh

      - name: Build
        run: ./build.sh

      - name: Verify signer
        run: |
          set -euo pipefail
          TEAM="$(codesign -dv build/stage/Vorssaint.app 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [[ -z "$TEAM" || "$TEAM" == "not set" ]]; then
            echo "The app was not signed with a team certificate; updates would be refused" >&2
            exit 1
          fi
          echo "Signed by team $TEAM"
          codesign --verify --deep --strict build/stage/Vorssaint.app

      - name: Selftest
        run: ./build/stage/Vorssaint.app/Contents/MacOS/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Sign DMG
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -v -p codesigning \
            | sed -nE 's/.*"((Developer ID Application|Apple Development):.*)"/\1/p' | head -1)"
          DMG="$(ls dist/*.dmg | head -1)"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          codesign --verify --strict "$DMG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          ARGS=("$TAG" dist/*.dmg --title "$TAG" --generate-notes)
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            ARGS+=(--verify-tag)
          else
            ARGS+=(--target "$(git rev-parse HEAD)")
          fi
          if [[ "$TAG" =~ -(beta|rc|alpha) ]]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "${ARGS[@]}" --repo "$GITHUB_REPOSITORY"
          fi
